name: partiduo-document
version: 0.1.2

description: |
  Extension DOCUMENT de Partiduo, successeur du module de justificatifs
  (NDER, NDC) de l'application d'origine : boîte unique « Justificatifs à traiter » (photos, fichiers
  déposés, factures reçues par la plateforme agréée), compléments facultatifs,
  saisie de l'écriture d'achat avec l'image à côté, rattachement à une
  écriture ou à une facture (ADR-005 D8, ADR-003).

authors:
  - Philippe Nénert <it+claude.ai@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  partiduo-document-manage:
    main: manage.cr

dependencies:
  # Le cœur : registre, événements, pièces jointes et contrat Partiduo::Api.
  partiduo:
    github: aloli-partiduo/partiduo-app
    branch: development
  marten:
    github: aloli-crystal/marten
    branch: production

development_dependencies:
  # L'interface qui monte ui/bulma/ : nécessaire aux specs et à manage.cr ;
  # la distribution l'apporte elle-même.
  partiduo-ui-bulma:
    github: aloli-partiduo/partiduo-ui-bulma
    branch: development
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
